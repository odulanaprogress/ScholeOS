# ScholeOS Identity Service — Cloudflare Worker Configuration
name = "scholeos-identity-service"
account_id = "b575d1d2e4c4eee31996355f36da2a71"
main = "src/services/identity/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "development"
FIREBASE_PROJECT_ID = "scholesos"

# Wave 6: Cloudflare Queues Configuration
[[queues.producers]]
queue = "notifications-queue"
binding = "NOTIFICATIONS_QUEUE"

[[queues.consumers]]
queue = "notifications-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
